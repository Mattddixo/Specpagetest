parameters:
  - name: orderId
    in: path
    required: true
    description: The order's ID
    schema:
      type: string
    example: ord_7Kq2
get:
  tags: [orders]
  summary: Get an order
  description: Returns one order with its items and current status.
  operationId: getOrder
  responses:
    '200':
      description: The order
      content:
        application/json:
          schema:
            $ref: ../schemas/Order.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
